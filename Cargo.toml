[package]
name = "scrip-miner"
version = "0.0.2"
edition = "2021"
description = "Reference Scrip miner: create a config, fund a wallet, mine."
license = "MIT"

[dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
ureq = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
getrandom = "0.2"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
